<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<style>
@font-face{font-family:Rozha;src:url(../../../../fonts/RozhaOne-Regular.ttf)}
@font-face{font-family:Yatra;src:url(../../../../fonts/YatraOne-Regular.ttf)}
@font-face{font-family:Noto;src:url(../../../../fonts/NotoSansDevanagari.ttf)}
html,body{margin:0;background:#050a1a;width:1080px;height:1920px;overflow:hidden}
canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 01 GLOBE ARCS — reference example. Deterministic: picture depends only on t.
const DURATION = 16; window.DURATION = DURATION;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let R = 380; const CX = 540, CY = 980, D2R = Math.PI / 180;
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r = rng(7), stars = [...Array(220)].map(() => [r()*1080, r()*1920, r()*1.8+.3]);
const STOPS = [ // [name, lat, lon, line]
  ['फ़रग़ना', 40.4, 71.8, '1494: 12 साल में बादशाह'],
  ['समरकंद', 39.6, 66.9, '3 बार जीता, 3 बार खोया'],
  ['काबुल', 34.5, 69.2, '1504: नया ठिकाना'],
  ['पानीपत', 29.4, 77.0, '1526: मुग़ल साम्राज्य की शुरुआत'],
];
function proj(lat, lon, rotLon, tilt) {           // orthographic projection
  const la = lat*D2R, lo = (lon - rotLon)*D2R, ti = tilt*D2R;
  let x = Math.cos(la)*Math.sin(lo), y = Math.sin(la), z = Math.cos(la)*Math.cos(lo);
  const y2 = y*Math.cos(ti) - z*Math.sin(ti), z2 = y*Math.sin(ti) + z*Math.cos(ti);
  return [CX + R*x, CY - R*y2, z2];
}
function text(s, x, y, font, size, fill, stroke=8, align='center') {
  g.font = `${size}px ${font}`; g.textAlign = align; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(0,0,0,.85)'; g.lineWidth = stroke; g.strokeText(s, x, y); g.fillStyle = fill; g.fillText(s, x, y);
}
window.renderAt = async (t) => {
  g.fillStyle = '#050a1a'; g.fillRect(0, 0, 1080, 1920);
  for (const [x, y, s] of stars) { g.fillStyle = `rgba(255,255,255,${.3 + .3*Math.sin(t*2 + x)})`; g.fillRect(x, y, s, s); }
  R = 380 + 2300*ease((t - .6)/1.6); const rotLon = 72 + 4*Math.sin(t*.25) - 30*(1 - ease((t - .6)/1.6)), tilt = 34;
  const glow = g.createRadialGradient(CX, CY, R*.7, CX, CY, R*1.35); glow.addColorStop(0,'rgba(60,140,255,.35)'); glow.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = glow; g.fillRect(0, 0, 1080, 1920);
  g.fillStyle = '#0b1f4a'; g.beginPath(); g.arc(CX, CY, R, 0, 7); g.fill();
  const st = R > 900 ? 1 : 5; for (let lat = -80; lat <= 80; lat += st) for (let lon = -180; lon < 180; lon += st) {   // dotted sphere
    const [x, y, z] = proj(lat, lon, rotLon, tilt); if (z <= 0) continue;
    const land = Math.sin(lat*.09)*Math.cos(lon*.07) + Math.sin(lon*.035 + lat*.05) > .35;
    g.fillStyle = land ? `rgba(140,200,255,${.35 + .6*z})` : `rgba(80,130,220,${.3*z})`;
    g.beginPath(); g.arc(x, y, land ? 3.2 : 2, 0, 7); g.fill();
  }
  STOPS.forEach((s, i) => {                          // arcs + pins
    const on = 1.4 + i*2.8; if (t < on) return;
    const [x, y, z] = proj(s[1], s[2], rotLon, tilt); if (z <= 0) return;
    if (i > 0) {
      const p = STOPS[i-1], [x0, y0] = proj(p[1], p[2], rotLon, tilt), k = ease((t - on)/1.2);
      const mx = (x0 + x)/2 + 90, my = Math.min(y0, y) - 120;
      g.strokeStyle = '#ffcf4a'; g.lineWidth = 6; g.shadowColor = '#ffb300'; g.shadowBlur = 18; g.beginPath();
      for (let u = 0; u <= k; u += .02) { const a = (1-u)*(1-u)*x0 + 2*(1-u)*u*mx + u*u*x, b = (1-u)*(1-u)*y0 + 2*(1-u)*u*my + u*u*y; u ? g.lineTo(a, b) : g.moveTo(a, b); }
      g.stroke(); g.shadowBlur = 0; if (k < 1) return;
    }
    const pulse = 10 + 6*Math.sin(t*6); g.fillStyle = '#ffcf4a'; g.beginPath(); g.arc(x, y, pulse, 0, 7); g.fill();
    text(s[0], x + (i % 2 ? -26 : 26), y - 24, 'Yatra', 52, '#fff', 8, i % 2 ? 'right' : 'left');
  });
  const cur = Math.min(STOPS.length - 1, Math.max(0, Math.floor((t - 1.4 - (t > 4.2 ? 1.2 : 0))/2.8)));   // caption card
  if (t > 1.4 && t < 13.8) {
    g.fillStyle = 'rgba(8,18,45,.85)'; g.strokeStyle = 'rgba(255,207,74,.8)'; g.lineWidth = 3;
    g.beginPath(); g.roundRect(90, 1450, 900, 130, 30); g.fill(); g.stroke();
    text(STOPS[cur][3], 540, 1535, 'Noto', 50, '#ffe9a8', 0);
  }
  const hook = t < 1.6 ? 1 : 1 - ease((t - 1.6)/.4);
  if (hook > 0) { g.globalAlpha = hook; text('12 साल का लड़का', 540, 330, 'Rozha', 110, '#fff', 12); text('कैसे पहुँचा पानीपत?', 540, 460, 'Rozha', 96, '#ffcf4a', 12); g.globalAlpha = 1; }
  if (t > 1.6) text('बाबर का सफ़र', 540, 380, 'Rozha', 104, '#fff', 12);
  text('कथा और रहस्य', 540, 140, 'Yatra', 40, '#ffcf4a', 6);
  if (t > 13.8) { g.globalAlpha = ease((t - 13.8)/.5); text('पूरी कहानी चैनल पर 👆', 540, 1530, 'Rozha', 76, '#fff', 10); g.globalAlpha = 1; }
};
document.fonts.load('40px Rozha').then(() => document.fonts.load('40px Yatra')).then(() => document.fonts.load('40px Noto')).then(() => { window.ready = true; });
</script></body></html>
